# Trust Verify — adopts the Flow Agents external trust anchor on this repo (ADVISORY).
#
# On every PR, re-runs this repo's canonical verification FRESH in a clean CI
# environment an agent does not control — the same `npm run verify` that
# publish-npm.yml's "verify" job runs before a release (typecheck, build+test,
# and the package-contents check). If a Flow Agents session has published
# delivery/trust.bundle, it also RECONCILES the agent's claimed passes against
# CI's own fresh results and fails on any divergence. When no bundle is present,
# only the fresh verify is enforced (fail-open on bundle absence; fail-closed on
# divergence when present).
#
# NOTE: this repo has no PR-triggered comprehensive-verify workflow today — only
# veritas-advisory.yml (governance readiness) runs on pull_request, and
# publish-npm.yml's verify job is workflow_dispatch/tag-only. This workflow is
# the first PR-triggered comprehensive verify gate for this repo, mirroring
# publish-npm.yml's `npm run verify` step.
#
# ADVISORY PHASE: this workflow runs and reports but does NOT block merges yet.
# To ARM it: add "Trust Verify" as a required, no-bypass status check in this
# repo's branch protection (Settings → Branches → main).
#
# Adoption guide: https://github.com/kontourai/flow-agents/blob/main/docs/trust-anchor-adoption.md
name: Trust Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  trust-verify:
    name: Trust Verify
    outputs:
      failure-summary: ${{ steps.trust-verify.outputs.failure-summary }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the reconciler binds delivery bundles to commits via
      # `git merge-base --is-ancestor`, which cannot walk a shallow clone —
      # with the default depth-1 checkout every committed bundle looks stale
      # in CI (sealed commit never equals the synthetic merge SHA).
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The external anchor: re-run this repo's real verify fresh + reconcile any
      # delivered bundle. SHA-pinned (mutable tags are not trusted for a cross-repo
      # action that gates merges).
      #
      # verify-command mirrors publish-npm.yml's "verify" job exactly: `npm run
      # verify`, i.e. typecheck, npm test (build + node --test suite), then
      # check:pack.
      - id: trust-verify
        uses: kontourai/flow-agents/.github/actions/trust-verify@90b260996e1c4477c56317935f0362d48a8cf8d5 # flow-agents Trust failure summary output
        with:
          verify-command: "npm run verify"

  trust-advisory-comment:
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    needs: trust-verify
    permissions:
      pull-requests: write
    uses: kontourai/.github/.github/workflows/trust-advisory-comment.yml@e6dfe1bea874266a98059c682c21a6b73ae9c71e
    with:
      check-name: Trust Verify
      pr-number: ${{ github.event.pull_request.number }}
      result: ${{ needs['trust-verify'].result }}
      details: ${{ needs['trust-verify'].outputs.failure-summary }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
