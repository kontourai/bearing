# Dependency install scripts are blocked by default (pnpm >= 10). Only the
# packages listed here, at exactly these versions, may run a build script.
# esbuild: postinstall selects the platform binary; without it the JS fallback
# runs and Playwright's config loader is ~10x slower. Bump the pin with the dep.
allowBuilds: {}


# A newly published version must be at least 24 hours old before it can be
# resolved into this lockfile. Blunts the most common supply-chain shape (a
# compromised maintainer publishes and the ecosystem installs within hours).
# Does not affect installs from an existing lockfile. An urgent security patch
# is opted in explicitly, by name and version, with the reason in the commit:
#   minimumReleaseAgeExclude:
#     - some-package@1.2.3
minimumReleaseAge: 1440

# mise supplies node and pnpm on developer machines; CI installs the exact
# version pinned in package.json. Do not reject a same-major pnpm from mise.
pmOnFail: ignore
